# Authoritative-only stub resolver for the lab LAN.
# Toggle file /tmp/rts-filter.conf is written by filter-on.sh / filter-off.sh.
interface=eth1
bind-interfaces
no-resolv
no-hosts
no-dhcp-interface=eth1
domain-needed
bogus-priv
log-queries
log-facility=-
# Do not forward anything; unknown names become NXDOMAIN.
conf-file=/tmp/rts-filter.conf
